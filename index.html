<style>
:root{--bg:#f2f5fb;--card:#ffffff;--card2:#eef2f9;--bd:#dbe2ee;--ac:#1f6feb;--ac2:#1556c0;--tx:#14213d;--mu:#667389;--gr:#16a34a;--or:#f59e0b;--bl:#1f6feb;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{color-scheme:light;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:0 auto;padding:14px 14px 20px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.5px}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:15px;margin:16px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
p{margin:4px 0}
.mu{color:var(--mu)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:10px 0}
.hero{background:linear-gradient(135deg,#dbe8ff,#f5f8ff 75%);border-color:#bcd2fb}
.card,.kpi,.ex,details{box-shadow:0 1px 3px rgba(20,33,61,.06)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;letter-spacing:-.5px}
.kpi span{color:var(--mu);font-size:12px}
.btn{appearance:none;border:0;background:var(--ac);color:#fff;font-weight:700;font-size:16px;padding:13px 18px;border-radius:14px;cursor:pointer;width:100%}
.btn:active{transform:scale(.98);background:var(--ac2)}
.btn.ghost{background:#fff;border:1px solid #b8c8f5;color:var(--ac)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:#fff1f1;border:1px solid #f3c1c1;color:#c62828}
.btn.green{background:#16a34a}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--bd);color:var(--tx);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
.pcard.on{border-color:var(--ac);background:#eaf2ff}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.tag.today{background:var(--ac);color:#fff}
select,input{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--ac)}
canvas{width:100%;height:210px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.adv{border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;border:1px solid}
.adv.up{background:#e8f8ef;border-color:#a8e3c1;color:#0f6b36}
.adv.keep{background:#fff6e0;border-color:#f2d58b;color:#8a5a00}
.adv.down{background:#fdecec;border-color:#f1b5b5;color:#b42318}
.adv.new{background:#eaf0ff;border-color:#b8c8f5;color:#2a4bb0}
.chipx{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chipx.up{background:#d9f3e4;color:#0f6b36}.chipx.keep{background:#fdeec7;color:#8a5a00}.chipx.down{background:#fbdcdc;color:#b42318}.chipx.new{background:#dfe8ff;color:#2a4bb0}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:12px 0}
.ex.complete{border-color:#7bd3a1;background:#f6fcf9}
.ex h4{margin:0;font-size:17px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin:7px 0}
.set.cardio,.set.time{grid-template-columns:26px 1fr 1fr 46px}
.set .n{color:var(--mu);font-weight:700;text-align:center}
.f{position:relative;display:block}
.f input{padding-right:38px;text-align:center;font-size:18px;font-weight:700}
.f i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mu);font-size:12px;pointer-events:none}
.chk{appearance:none;border:2px solid var(--bd);background:var(--card2);color:var(--mu);height:44px;border-radius:12px;font-size:20px;font-weight:800;cursor:pointer}
.set.done .chk{background:var(--gr);border-color:var(--gr);color:#fff}
.set.done input{opacity:.65}
.sticky{position:sticky;top:0;z-index:20;background:rgba(242,245,251,.96);backdrop-filter:blur(8px);padding:10px 14px;margin:-14px -14px 8px;border-bottom:1px solid var(--bd)}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--ac);transition:width .3s}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;appearance:none;border:0;background:none;color:var(--mu);padding:9px 0 8px;font-size:11px;font-weight:700;cursor:pointer}
#tabs button span{display:block;font-size:20px;line-height:1.2}
#tabs button{font-size:10.5px!important}
.stp{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center;margin:4px 0 8px}
.stp b{text-align:center;font-size:26px;font-variant-numeric:tabular-nums}
.stp b small{font-size:13px;color:var(--mu);font-weight:600;margin-left:4px}
.stp .ib{width:48px;height:48px;font-size:24px;border-radius:12px;color:var(--ac);border-color:#b8c8f5;background:#fff}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px;flex:none}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.pl:last-child{border:0}.pl .a{display:flex;align-items:center;min-width:0;font-weight:700}
.pl .b{white-space:nowrap;color:var(--mu)}.pl .b b{color:var(--tx)}
.sws{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sw{width:36px;height:36px;border-radius:10px;border:3px solid transparent;cursor:pointer;padding:0;appearance:none}
.sw.on{border-color:#14213d}
.warm{border-color:#b8c8f5;background:#f7faff}
.warm.complete{border-color:#7bd3a1;background:#f6fcf9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#tabs button.on{color:var(--ac)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;background:#fff;border:2px solid var(--ac);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(20,33,61,.25);max-width:616px;margin:0 auto}
#rest.show{display:flex}#rest.go{border-color:var(--gr);background:#effaf3}
#rest .t{font-size:22px;white-space:nowrap;font-weight:800;flex:1;font-variant-numeric:tabular-nums}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(20,33,61,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;border:1px solid var(--bd)}
#sheet h3{margin-top:0;color:var(--tx);font-size:18px;text-transform:none;letter-spacing:0}
.fl{display:block;margin:10px 0;font-size:13px;color:var(--mu);font-weight:600}.fl input,.fl select{margin-top:5px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.erow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.erow:last-child{border:0}
.erow .nm{flex:1;min-width:0}.erow .nm b{display:block;font-size:15px}
.ib{appearance:none;border:1px solid var(--bd);background:var(--card2);color:var(--tx);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer}
.pick{padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14213d;color:#fff;border:1px solid #14213d;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;display:none;max-width:90%}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:12px monospace}
.srch{margin-bottom:6px}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
/* Premium 2026 */
.card,.kpi,.ex,details{box-shadow:0 7px 24px rgba(20,33,61,.07);border-color:#e2e8f2}.card{padding:16px}.kpi{padding:15px}.btn{min-height:48px}.ib{min-width:42px;height:42px}.ex{padding:14px;margin:16px 0;border-radius:20px}.ex.complete{background:#effaf3;border-color:#73cf98}.set{grid-template-columns:38px 1fr 1fr 58px;gap:10px;margin:8px 0 14px;padding:10px;border-radius:14px;background:#f8faff;transition:.22s}.set.done{background:#e8f8ef;box-shadow:inset 0 0 0 1px #9bdcb6;animation:setok .28s ease}.set .n{font-size:19px;color:#1f6feb}.f input{height:54px;font-size:21px;background:#fff}.chk{height:54px;font-size:25px}.prevline{margin:12px 0 2px;padding:7px 10px;color:#647895;background:#f3f7fd;border-radius:10px;font-size:12px}.exhead{padding-bottom:10px;border-bottom:1px solid #edf1f7}.rest-inline{margin:8px 0;padding:13px;border-radius:14px;background:#edf5ff;border:1px solid #b9d3ff}.rest-inline .clock{font-size:28px;font-weight:850;color:#1556c0;font-variant-numeric:tabular-nums}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal .dow{text-align:center;color:var(--mu);font-size:11px;font-weight:800}.cal .day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:#f5f7fb;font-size:12px}.cal .trained{background:#1f6feb;color:#fff;font-weight:800;box-shadow:0 3px 9px rgba(31,111,235,.25)}.cal .blank{background:transparent}.perfmini{padding:10px 0;border-bottom:1px solid #edf1f7}.perfmini:last-child{border:0}.premium-weight{height:290px!important}.danger-zone{margin-top:26px}.restcfg{display:flex;align-items:center;gap:6px;margin-top:8px}.pulse{animation:setok .28s ease}@keyframes setok{0%{transform:scale(.98)}65%{transform:scale(1.015)}100%{transform:scale(1)}}
@media(max-width:420px){.set{grid-template-columns:34px 1fr 1fr 54px;padding:8px;gap:7px}.f input{font-size:19px}.ex{padding:12px}.grid4{gap:8px}.kpi b{font-size:21px}}

/* IRONLOG NEO - interface alternative iPhone */
:root{--bg:#f1f4f9;--card:#ffffff;--card2:#f7f9fc;--tx:#101828;--mu:#718096;--bd:#e8edf5;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
body{background:radial-gradient(circle at 15% -10%,#dbeafe 0,transparent 30%),linear-gradient(180deg,#f8faff 0,#f1f4f9 38%,#eef2f7 100%);letter-spacing:-.01em}
#view{max-width:780px;padding:20px 16px 150px}
h1{font-size:32px;line-height:1.05;letter-spacing:-1.1px;margin:12px 0 5px}h2{font-size:19px;letter-spacing:-.35px;margin:27px 2px 11px}.mu{color:#718096}
.card,.kpi,.ex,details{border:0;background:rgba(255,255,255,.94);box-shadow:0 12px 34px rgba(28,50,91,.075)}
.card{border-radius:24px;padding:19px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f4fd6 0%,#3178f6 58%,#61a2ff 100%);color:#fff;padding:24px;box-shadow:0 18px 38px rgba(37,99,235,.24)}
.hero:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;right:-55px;top:-65px;background:rgba(255,255,255,.12)}.hero .mu{color:rgba(255,255,255,.78)}.hero .btn{background:#fff;color:#1d5ed7;box-shadow:0 7px 20px rgba(0,0,0,.13)}
.grid4{grid-template-columns:repeat(2,1fr);gap:11px}.kpi{min-height:102px;border-radius:22px;display:flex;flex-direction:column;justify-content:center}.kpi b{font-size:25px;letter-spacing:-.7px}.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.45px;margin-top:6px}
.btn{border-radius:16px;min-height:52px;font-weight:800;letter-spacing:.1px;background:linear-gradient(135deg,#1f63e9,#347ef7);box-shadow:0 8px 18px rgba(37,99,235,.20)}.btn.ghost{background:#f3f6fb;color:#295994;box-shadow:none;border:1px solid #e3eaf5}.btn.green{background:linear-gradient(135deg,#119a55,#22b968)}.btn.danger{background:linear-gradient(135deg,#d62c3e,#ed4557)}
.chip{border:0;background:#eef3fa;color:#53657d;padding:9px 13px}.chip.on{background:#e2ecff;color:#1e5cd1;box-shadow:inset 0 0 0 1px #b9d0ff}
.ex{border-radius:26px;padding:17px;margin:19px 0}.exhead{border:0;padding-bottom:5px}.exhead b{font-size:18px}.prevline{background:transparent;border:0;border-left:3px solid #bfd3f6;border-radius:0;padding:3px 9px;margin:14px 4px 5px;color:#7386a3}
.set{background:#f3f6fb;border:1px solid #ebf0f7;border-radius:18px;padding:11px;gap:9px}.set .n{width:34px;height:34px;border-radius:12px;background:#e5edfc;display:grid;place-items:center;color:#245fc8;font-size:16px}.set.done{background:#ecf9f1;border-color:#c0e6ce;box-shadow:0 8px 22px rgba(22,163,74,.10)}.set.done .n{background:#24a760;color:#fff}.f label{font-size:10px;letter-spacing:.55px}.f input{height:58px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #dce4ef;font-size:23px;font-weight:800}.chk{width:auto;min-width:58px;height:58px;border-radius:15px;background:#2467e8;color:#fff;border:0}.set.done .chk{background:#16a34a}
#rest{left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));border:0;border-radius:22px;padding:12px;background:rgba(15,37,70,.96);box-shadow:0 18px 44px rgba(15,37,70,.28);backdrop-filter:blur(18px)}#rest .t{color:#fff;font-size:17px}#rest .ib,#rest .btn{min-height:42px;height:42px;background:#fff;color:#173c76;box-shadow:none}

/* Liquid Glass navigation */
#tabs{
 left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:74px;
 padding:7px;border:1px solid rgba(255,255,255,.70);border-radius:27px;
 background:linear-gradient(135deg,rgba(255,255,255,.68),rgba(238,246,255,.42));
 -webkit-backdrop-filter:blur(28px) saturate(185%);backdrop-filter:blur(28px) saturate(185%);
 box-shadow:0 16px 42px rgba(35,62,105,.20),inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(134,163,204,.14);
 overflow:hidden;isolation:isolate
}
#tabs:before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.16) 32%,rgba(130,187,255,.10) 63%,rgba(255,255,255,.42) 100%);z-index:-1}
#tabs:after{content:'';position:absolute;left:8%;right:8%;top:1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none}
#tabs button{position:relative;background:transparent!important;color:#78879b;border:1px solid transparent;border-radius:20px;transition:transform .18s ease,color .18s ease,background .18s ease,box-shadow .18s ease;z-index:1}
#tabs button:active{transform:scale(.94)}
#tabs button.on{color:#1559ca!important;background:linear-gradient(150deg,rgba(255,255,255,.88),rgba(218,234,255,.63))!important;border-color:rgba(255,255,255,.92);box-shadow:0 7px 18px rgba(45,92,159,.16),inset 0 1px 1px rgba(255,255,255,1),inset 0 -1px 1px rgba(116,160,221,.12);transform:translateY(-1px)}
#tabs button.on:before{content:'';position:absolute;left:20%;right:20%;top:3px;height:1px;background:rgba(255,255,255,.95);border-radius:99px}
#tabs button span{filter:drop-shadow(0 1px 0 rgba(255,255,255,.8));transition:transform .18s ease}#tabs button.on span{transform:scale(1.08)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#tabs{background:rgba(246,250,255,.96)}}

<script>
(function(){
'use strict';
/* ================= Utilitaires ================= */
const LEGACY_KEY='ironlog.v1';
const KEY='ironlog.file.'+location.pathname;
const PAL=['#1f6feb','#f97316','#16a34a','#a855f7','#e11d48','#0891b2','#ca8a04','#64748b'];
const DEFCOL={lun:'#1f6feb',mar:'#f97316',mer:'#16a34a',jeu:'#a855f7',ven:'#e11d48'};
const up=t=>String(t).toUpperCase();
const DAYS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const DAYFULL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmt=v=>String(Math.round(v*10)/10).replace('.',',');
const fmtK=v=>v>=1000?(Math.round(v/100)/10).toString().replace('.',',')+'k':fmt(v);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const dFr=iso=>{const p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const dSh=iso=>{const p=iso.split('-');return p[2]+'/'+p[1]};
const durLabel=m=>m<60?m+' min':(m%60?Math.floor(m/60)+'h'+pad(m%60):Math.floor(m/60)+'h');
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
const r05=v=>Math.round(v*2)/2;

/* ================= Données par défaut ================= */
const ex=(name,sets,min,max,inc,mode,label)=>({id:uid(),name,sets,min,max,inc:inc==null?2.5:inc,mode:mode||'reps',label:label||''});
function defaultPrograms(){return[
 {id:'lun',name:'Pecs + Triceps',day:1,rest:75,tip:'Repos : 60 à 90 s',ex:[
  ex('Développé couché',4,8,10,2.5),ex('Développé incliné haltères',4,10,12,2),ex('Écartés poulie',3,12,15,1),
  ex('Dips ou pompes',3,8,15,2.5,'reps','max propre'),ex('Extension triceps corde',3,12,15,2.5),ex('Barre au front',3,10,12,2.5)]},
 {id:'mar',name:'Dos + Biceps',day:2,rest:75,tip:'Cherche la contraction du dos',ex:[
  ex('Tirage poulie haute',4,8,12,2.5),ex('Rowing assis poulie',4,10,12,2.5),ex('Rowing haltère un bras',3,10,12,2),
  ex('Face pull',3,12,15,2.5),ex('Curl barre EZ',3,10,12,2.5),ex('Curl marteau',3,12,15,1)]},
 {id:'mer',name:'Jambes',day:3,rest:90,tip:'Contrôle la descente',ex:[
  ex('Squat ou presse à cuisses',4,8,12,5),ex('Soulevé de terre roumain',4,10,12,5),ex('Fentes marchées',3,12,12,2,'reps','12 / jambe'),
  ex('Leg curl',3,12,15,2.5),ex('Leg extension',3,12,15,2.5),ex('Mollets debout',3,15,20,5)]},
 {id:'jeu',name:'Épaules + Abdos',day:4,rest:75,tip:'Garde le tronc gainé',ex:[
  ex('Développé militaire',4,8,10,2),ex('Élévations latérales',4,12,15,1),ex('Oiseau haltères',3,12,15,1),
  ex('Face pull',3,12,15,2.5),ex('Crunch câble',3,15,20,2.5),ex('Gainage',3,30,45,0,'time')]},
 {id:'ven',name:'Full body + Finisher',day:5,rest:60,tip:'Intensité propre, sans bâcler',ex:[
  ex('Goblet squat',3,12,12,2),ex('Tirage horizontal',3,12,12,2.5),ex('Développé haltères',3,10,10,2),
  ex('Hip thrust',3,10,12,5),ex('Fentes alternées',3,12,12,2,'reps','12 / jambe'),ex('Finisher cardio',1,8,10,0,'cardio')]}
]}
const BUILTIN=[
 ['Développé couché',4,8,10,2.5,'reps'],['Développé incliné barre',3,8,12,2.5,'reps'],['Pecfly',3,12,15,2.5,'reps'],['Pompes',3,10,20,2.5,'reps'],
 ['Tirage menton',3,10,12,2,'reps'],['Élévation latérale poulie',3,12,15,1,'reps'],['Triceps poulie barre',3,10,15,2.5,'reps'],['Dips machine',3,8,12,2.5,'reps'],
 ['Tractions',3,6,12,2.5,'reps'],['Tirage vertical',3,8,12,2.5,'reps'],['Tirage nuque',3,10,12,2.5,'reps'],['Rowing barre',4,8,10,2.5,'reps'],['Rowing bûcheron',3,10,12,2,'reps'],
 ['Curl biceps banc',3,8,12,1,'reps'],['Curl pupitre',3,10,12,2.5,'reps'],['Curl poulie',3,10,15,2.5,'reps'],
 ['Presse à cuisses',4,8,12,10,'reps'],['Squat',4,6,10,5,'reps'],['Hack squat',3,8,12,5,'reps'],['Soulevé de terre',3,5,8,5,'reps'],['Hip thrust',3,8,12,5,'reps'],['Mollets assis',4,12,20,2.5,'reps'],
 ['Développé épaules machine',3,10,12,2.5,'reps'],['Arnold press',3,8,12,2,'reps'],['Shrugs haltères',3,10,15,2,'reps'],
 ['Crunch',3,15,25,0,'reps'],['Relevé de jambes',3,10,15,0,'reps'],['Planche',3,30,60,0,'time'],
 ['Vélo',1,10,20,0,'cardio'],['Rameur',1,8,15,0,'cardio'],['Tapis de course',1,10,20,0,'cardio']
].map(a=>({name:a[0],sets:a[1],min:a[2],max:a[3],inc:a[4],mode:a[5]}));

function seed(){
 return migrate({programs:defaultPrograms(),sessions:[],trash:[],active:null,weights:[],goalW:null,ui:{tab:'dash',progId:null,dur:60,exKey:null,pie:'vol',wRange:'all',theme:'light'}});
}

/* ================= Stockage ================= */
let memOnly=false;
function lastWarm(list){
 const ss=list.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
 let inc=0,sp=0;
 ss.forEach(x=>{if(x.warm){if(x.warm.incline)inc=x.warm.incline;if(x.warm.speed)sp=x.warm.speed}});
 return{incline:Math.min(16,Math.max(1,Math.round(inc)||1)),speed:Math.min(20,Math.max(0.5,Math.round((sp||0.5)*2)/2))};
}
function migrate(o){
 o.sessions=o.sessions.filter(x=>!(x.minutes===0&&x.dur===0));
 o.weights=Array.isArray(o.weights)?o.weights:[];o.trash=Array.isArray(o.trash)?o.trash:[];if(o.goalW===undefined)o.goalW=null;
 o.ui=o.ui||{};o.ui.pie=o.ui.pie||'vol';o.ui.wRange=o.ui.wRange||'all';o.ui.calMonth=o.ui.calMonth||todayISO().slice(0,7);o.ui.homeExKey=o.ui.homeExKey||null;o.ui.theme=o.ui.theme||'light';
 o.programs.forEach((p,i)=>{if(!p.color)p.color=DEFCOL[p.id]||PAL[i%PAL.length];p.name=up(p.name)});
 o.sessions.forEach(x=>{if(!x.warm){const k=x.exos.findIndex(e=>e.key==='marche-inclinee');if(k>=0){const e=x.exos[k],st=e.sets[0]||{};x.warm={min:parseFloat(st.r)||10,incline:Math.min(16,Math.max(0,parseFloat(st.w)||0)),speed:0};x.exos.splice(k,1)}}});
 if(o.active&&!o.active.warm){const lw=lastWarm(o.sessions);o.active.warm={min:10,incline:lw.incline,speed:lw.speed,done:false,tEnd:0}}
 return o;
}
function load(){
 try{const r=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY);if(r){const o=JSON.parse(r);if(o&&o.programs&&o.sessions){o.ui=Object.assign({tab:'dash',progId:null,dur:60,exKey:null,pie:'vol',wRange:'all'},o.ui||{});return migrate(o)}}}catch(e){memOnly=true}
 return seed();
}
let S=load();
function save(){try{const payload=JSON.stringify(S);localStorage.setItem(KEY,payload);localStorage.setItem(LEGACY_KEY,payload)}catch(e){memOnly=true}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)}

/* ================= Analyse ================= */
const sortedSess=()=>S.sessions.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const volOf=s=>s.exos.reduce((a,e)=>a+(e.mode==='reps'?e.sets.reduce((b,x)=>b+num(x.w)*num(x.r),0):0),0);
const setsOf=s=>s.exos.reduce((a,e)=>a+e.sets.length,0);
function lastPerf(key){
 const ss=sortedSess();
 for(let i=ss.length-1;i>=0;i--){const e=ss[i].exos.find(x=>x.key===key);if(e&&e.sets.length)return{date:ss[i].date,sets:e.sets.map(s=>({w:num(s.w),r:num(s.r)})),mode:e.mode}}
 return null;
}
function historyKeys(){
 const m={};sortedSess().forEach(s=>s.exos.forEach(e=>{m[e.key]={key:e.key,name:e.name,mode:e.mode,min:e.min,max:e.max,inc:e.inc,sets:e.sets.length}}));
 return Object.values(m);
}
function metaOf(key){
 for(const p of S.programs)for(const e of p.ex)if(slug(e.name)===key)return e;
 return historyKeys().find(h=>h.key===key)||{name:key,mode:'reps',min:8,max:12,inc:2.5};
}
/* Progression double : toutes les séries à la charge max atteignent le haut de la fourchette => on augmente */
function suggest(e,last){
 const min=e.min,max=e.max,inc=e.inc==null?2.5:e.inc;
 if(!last||!last.sets.length)return{type:'new',text:'Première fois : choisis une charge qui te permet de finir '+(min===max?max:min+'-'+max)+(e.mode==='time'?' s':e.mode==='cardio'?' min':' reps')+' proprement.',weight:null,r:min};
 if(e.mode==='cardio'){const m=Math.max(...last.sets.map(s=>s.r));return{type:'up',text:'Dernière fois '+fmt(m)+' min → vise '+fmt(m+1)+' min (ou une intensité un cran au-dessus).',weight:null,r:m+1}}
 if(e.mode==='time'){const m=Math.min(...last.sets.map(s=>s.r));if(m>=max)return{type:'up',text:'Toutes les séries à '+max+' s → vise '+(max+5)+' s.',weight:null,r:max+5};return{type:'keep',text:'Vise '+max+' s sur chaque série (dernière fois : '+fmt(m)+' s mini).',weight:null,r:Math.min(max,m+5)}}
 const top=Math.max(...last.sets.map(s=>s.w));
 const ws=last.sets.filter(s=>s.w===top);
 const avg=ws.reduce((a,s)=>a+s.r,0)/ws.length;
 const rng=min===max?String(max):min+'-'+max;
 if(ws.length>=Math.min(2,last.sets.length)&&ws.every(s=>s.r>=max)){
  if(inc>0){const w=r05(top+inc);return{type:'up',text:'↑ Passe à '+fmt(w)+' kg : toutes tes séries à '+fmt(top)+' kg ont atteint '+max+' reps (+'+fmt(inc)+' kg).',weight:w,r:min}}
  return{type:'up',text:'↑ Toutes les séries ont atteint '+max+' reps : ajoute du lest ou ralentis la descente.',weight:top,r:min};
 }
 if(avg<min-2){const w=Math.max(0,r05(top-inc));return{type:'down',text:'↓ Baisse à '+fmt(w)+' kg : ~'+fmt(avg)+' reps de moyenne pour un objectif de '+rng+'.',weight:w,r:min}}
 return{type:'keep',text:'= Garde '+fmt(top)+' kg : vise '+max+' reps sur toutes les séries (moyenne dernière fois : '+fmt(avg)+', objectif '+rng+').',weight:top,r:Math.min(max,Math.ceil(avg)+0)};
}

/* ================= Génération de séance selon la durée ================= */
const workSecs=e=>e.mode==='time'?(e.max||40):40;
const setSecs=(e,rest)=>workSecs(e)+rest;
const exSecs=(e,n,rest)=>e.mode==='cardio'?(e.max||10)*60:60+n*setSecs(e,rest);
function buildPlan(p,dur){
 const rest=p.rest||75;
 const warm=600;
 const budget=dur*60-warm;
 let items=p.ex.map(e=>Object.assign({},e,{planned:e.mode==='cardio'?1:e.sets}));
 const total=()=>items.reduce((a,i)=>a+exSecs(i,i.planned,rest),0);
 let guard=300;
 while(total()>budget&&guard--){
  // choisit l'exercice avec le plus de séries (le dernier en cas d'égalité)
  let mx=2,ci=-1;items.forEach((i,k)=>{if(i.mode!=='cardio'&&i.planned>2&&i.planned>=mx){mx=i.planned;ci=k}});
  if(ci>=0){items[ci].planned--;continue}
  if(items.length>2)items.pop();else break;
 }
 const kept=new Set(items.map(i=>i.id));
 const dropped=p.ex.filter(e=>!kept.has(e.id));
 // marge de temps : ajoute jusqu'à +1 série sur les exercices prioritaires
 let changed=true;
 while(changed){changed=false;
  for(const i of items.slice(0,3)){
   if(i.mode==='cardio'||i.planned>=i.sets+(dur>=90?2:1))continue;
   if(dropped.length)break;
   if(total()+setSecs(i,rest)<=budget){i.planned++;changed=true}
  }
 }
 return{items,dropped,total:total()+warm,budget:dur*60,warm,rest};
}
function newExo(e,planned,rest){
 const key=slug(e.name),last=lastPerf(key),sug=suggest(e,last);
 const sets=[];
 for(let j=0;j<planned;j++){sets.push({w:'',r:'',done:false})}
 return{key,name:e.name,mode:e.mode||'reps',min:e.min,max:e.max,inc:e.inc,label:e.label||'',rest:e.rest||rest,sets};
}

/* ================= Graphiques (canvas) ================= */
function draw(cv,o){
 if(!cv)return;
 const dpr=Math.min(window.devicePixelRatio||1,3),W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
 cv.width=W*dpr;cv.height=H*dpr;
 const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
 c.font='11px -apple-system,system-ui,sans-serif';
 const n=o.labels.length;
 if(!n){c.fillStyle='#667389';c.textAlign='center';c.fillText('Pas encore de données',W/2,H/2);return}
 const pl=34,pr=o.line?40:10,pt=16,pb=24,w=W-pl-pr,h=H-pt-pb,slot=w/n,xs=i=>pl+slot*(i+.5);
 let bmax=Math.max.apply(null,o.bars.vals.concat(o.band?[o.band[1]]:[0]))*1.18;if(!bmax)bmax=1;
 const yb=v=>pt+h-(v/bmax)*h;
 c.strokeStyle='#e3e9f4';c.lineWidth=1;c.fillStyle='#667389';c.textAlign='right';
 for(let k=0;k<=4;k++){const v=bmax*k/4,y=yb(v);c.beginPath();c.moveTo(pl,y);c.lineTo(pl+w,y);c.stroke();c.fillText(fmtK(v),pl-5,y+4)}

function addWeight(v,date){

function remainMin(a){

}

 if(!a.exos.length)h+=`<div class="card"><p class="mu">Aucun exercice. Ajoute-en un pour commencer.</p></div>`;
 a.exos.forEach((e,i)=>{

  const lastTxt=lp?(e.mode==='reps'?lp.sets.map(s=>fmt(s.w)+' kg × '+fmt(s.r)).join(' · '):lp.sets.map(s=>fmt(s.r)).join(' · ')+(e.mode==='time'?' s':' min')):'';

 });

window.ironRestoreSession=function(id){const i=(S.trash||[]).findIndex(x=>x.id===id);if(i<0)return;S.sessions.push(S.trash[i]);S.trash.splice(i,1);save();render();toast('Séance restaurée')};

window.ironAskPurgeSession=function(id){const s=(S.trash||[]).find(x=>x.id===id);if(!s)return;openSheet(`<h3>Suppression définitive</h3><p>Supprimer définitivement <b>${esc(up(s.name))}</b> du ${dFr(s.date)} ?</p><p class="mu sm">Cette action est irréversible.</p><div class="row" style="margin-top:14px"><button class="btn ghost" type="button" onclick="event.preventDefault();event.stopPropagation();window.ironCancelSheet()">Annuler</button><button class="btn danger" type="button" onclick="window.ironPurgeSession('${s.id}')">Supprimer définitivement</button></div>`)};

window.ironResetApp=function(){try{S=seed();restEnd=0;restTot=0;restDone=false;if(wl){try{wl.release()}catch(e){}wl=null}const payload=JSON.stringify(S);localStorage.setItem(KEY,payload);localStorage.setItem(LEGACY_KEY,payload);window.ironCancelSheet();render();go('dash');toast('Application réinitialisée')}catch(e){console.error(e);toast('Impossible de réinitialiser : '+(e&&e.message?e.message:'erreur'))}};

function startRest(sec){restEnd=Date.now()+sec*1000;restTot=sec;restDone=false;$('#rest').className='show';tickRest()}
function tickRest(){
 const el=$('#rest');if(!restEnd){el.className='';return}
 const left=Math.ceil((restEnd-Date.now())/1000);
 if(left>0){$('#restT').textContent='✅ Série validée · REPOS '+mmss(left);el.className='show'}
 else{
  if(!restDone){restDone=true;$('#restT').textContent='Go ! 💪';el.className='show go';try{navigator.vibrate&&navigator.vibrate([250,100,250])}catch(e){}beep();setTimeout(()=>{if(restDone){restEnd=0;el.className=''}},4000)}
 }
}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.3)}catch(e){}}
function tick(){
 const c=$('#chrono');
 if(c&&S.active){c.textContent=mmss((Date.now()-S.active.start)/1000)}
 const w=S.active&&S.active.warm;
 if(w&&w.tEnd){
  const left=Math.ceil((w.tEnd-Date.now())/1000),el=$('#wTimer');
  if(left>0){if(el)el.textContent=mmss(left)}
  else{w.done=true;w.tEnd=0;save();try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}beep();toast('Échauffement terminé 🔥');if(S.ui.tab==='sess')render()}
 }
 tickRest();
}
setInterval(tick,500);
let wl=null;
async function wake(){try{if(S.active&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});

/* ================= Feuilles (sheets) ================= */
let sheetCb=null,pickList=[];
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').className='show';armButtons($('#sheetBody'))}
function closeSheet(){$('#sheet').className='';sheetCb=null}
function exForm(title,e,extra,cb){
 const d=e||{name:'',mode:'reps',sets:3,min:8,max:12,inc:2.5,label:'',rest:75};
 openSheet(`<h3>${title}</h3>
 <label class="fl">Nom<input id="fN" value="${esc(d.name)}" placeholder="ex : Curl incliné"></label>
 <label class="fl">Type<select id="fM"><option value="reps">Charge + répétitions</option><option value="time">Durée (secondes)</option><option value="cardio">Cardio (minutes)</option></select></label>
 <div class="row3"><label class="fl">Séries<input id="fS" inputmode="numeric" value="${d.sets}"></label><label class="fl">Min<input id="fMin" inputmode="numeric" value="${d.min}"></label><label class="fl">Max<input id="fMax" inputmode="numeric" value="${d.max}"></label></div>
 <p class="mu sm" style="margin:-4px 0 6px">Min / Max = fourchette de reps (ou secondes / minutes selon le type).</p>
 <label class="fl">Pas de progression de la charge (kg)<input id="fI" inputmode="decimal" value="${d.inc}"></label><label class="fl">Repos après une série (secondes)<input id="fR" inputmode="numeric" value="${d.rest||75}"></label>
 ${extra||''}<div style="height:8px"></div><button class="btn" data-act="sheetSave">Enregistrer</button>`);
 $('#fM').value=d.mode||'reps';
 sheetCb=()=>{
  const name=$('#fN').value.trim();if(!name){toast('Donne un nom à l\'exercice');return false}
  const mode=$('#fM').value;let sets=Math.max(1,Math.round(num($('#fS').value))||1),min=num($('#fMin').value),max=num($('#fMax').value);
  if(!min&&!max){min=8;max=12}if(!max)max=min;if(!min)min=max;if(min>max){const t=min;min=max;max=t}
  if(mode==='cardio')sets=1;
  const inc=mode==='reps'?num($('#fI').value):0;
  const rest=Math.max(15,Math.round(num($('#fR').value))||75);return cb({name,mode,sets,min,max,inc,label:d.label||'',rest})!==false;
 };
}
function candidates(){
 const m=new Map();
 BUILTIN.forEach(b=>m.set(slug(b.name),b));
 historyKeys().forEach(h=>m.set(h.key,{name:h.name,mode:h.mode,sets:h.sets||3,min:h.min,max:h.max,inc:h.inc}));
 S.programs.forEach(p=>p.ex.forEach(e=>m.set(slug(e.name),{name:e.name,mode:e.mode,sets:e.sets,min:e.min,max:e.max,inc:e.inc,label:e.label})));
 return Array.from(m.values()).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}
function pickHTML(q){
 q=slug(q||'');
 const r=pickList.map((m,i)=>({m,i})).filter(x=>!q||slug(x.m.name).includes(q));
 return r.length?r.map(x=>`<div class="pick" data-act="pick" data-i="${x.i}"><b>${esc(x.m.name)}</b><span class="mu sm">${x.m.mode==='cardio'?'cardio':x.m.sets+' × '+(x.m.min===x.m.max?x.m.max:x.m.min+'-'+x.m.max)}</span></div>`).join(''):'<p class="mu">Aucun résultat. Crée-le ci-dessous.</p>';
}
function openPicker(){
 pickList=candidates();
 openSheet(`<h3>Ajouter un exercice</h3><input id="pickQ" class="srch" placeholder="Rechercher…"><div id="pickL">${pickHTML('')}</div><div style="height:10px"></div><button class="btn ghost" data-act="pickNew">+ Créer un nouvel exercice</button>`);
}
function progSelectHTML(){return `<label class="fl">L'ajouter aussi à un programme ?<select id="fP"><option value="">Non, seulement cette séance</option>${S.programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>`}
function progForm(p){
 const used=S.programs.map(q=>q.color),d=p||{name:'',day:null,rest:75,tip:'',color:PAL.find(c=>!used.includes(c))||PAL[S.programs.length%PAL.length]};
 let fCol=d.color;
 openSheet(`<h3>${p?'Modifier le programme':'Nouveau programme'}</h3>
 <label class="fl">Nom<input id="gN" value="${esc(d.name)}"></label>
 <label class="fl">Jour habituel<select id="gD"><option value="">Aucun</option>${[1,2,3,4,5,6,0].map(i=>`<option value="${i}" ${d.day===i?'selected':''}>${DAYFULL[i]}</option>`).join('')}</select></label>
 <label class="fl">Repos entre séries (secondes)<input id="gR" inputmode="numeric" value="${d.rest||75}"></label>
 <div class="fl">Couleur dans le graphique</div><div class="sws" id="sws">${PAL.map(c=>`<button type="button" class="sw ${c===fCol?'on':''}" data-c="${c}" style="background:${c}" aria-label="Couleur ${c}"></button>`).join('')}</div>
 <button class="btn" data-act="sheetSave" style="margin-top:14px">Enregistrer</button>
 ${p?`<div style="height:10px"></div><button class="btn danger" data-act="delProg" data-id="${p.id}">Supprimer ce programme</button>`:''}`);
 sheetCb=()=>{
  const name=up($('#gN').value.trim());if(!name){toast('Donne un nom');return false}
  const dv=$('#gD').value,rest=Math.max(15,Math.round(num($('#gR').value))||75);
  if(p){p.name=name;p.day=dv===''?null:+dv;p.rest=rest;p.color=fCol}
  else S.programs.push({id:uid(),name,day:dv===''?null:+dv,rest,tip:'',color:fCol,ex:[]});
 };
 $('#sws').addEventListener('click',ev=>{const b=ev.target.closest('.sw');if(!b)return;fCol=b.dataset.c;document.querySelectorAll('#sws .sw').forEach(x=>x.classList.toggle('on',x===b))});
}

/* ================= Actions ================= */
const P=id=>S.programs.find(p=>p.id===id);
function download(name,text){
 const b=new Blob([text],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500);
}
function finish(){
 const a=S.active;
 const exos=a.exos.map(e=>({key:e.key,name:e.name,mode:e.mode,min:e.min,max:e.max,inc:e.inc,sets:e.sets.filter(s=>s.done).map(s=>({w:num(s.w),r:num(s.r)}))})).filter(e=>e.sets.length);
 if(!exos.length){if(confirm('Aucune série validée. Quitter sans enregistrer ?')){S.active=null;restEnd=0;save();go('dash')}return}
 const tot=a.exos.reduce((x,e)=>x+e.sets.length,0),dn=a.exos.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0);
 if(dn<tot&&!confirm((tot-dn)+' série(s) non validée(s) seront ignorées. Terminer ?'))return;
 S.sessions.push({id:uid(),date:todayISO(),progId:a.progId,name:a.name,dur:a.dur,minutes:Math.max(1,Math.round((Date.now()-a.start)/60000)),warm:a.warm&&a.warm.done?{min:a.warm.min,incline:a.warm.incline,speed:a.warm.speed}:null,exos});
 S.active=null;restEnd=0;if(wl){try{wl.release()}catch(e){}wl=null}
 S.ui.exKey=exos[0].key;save();toast('Séance enregistrée 💪');go('dash');
}
window.ironRemoveExercise=function(i){if(!S.active||!S.active.exos[i])return;S.active.exos.splice(i,1);save();render();toast('Exercice supprimé')};
window.ironStop=function(){if(!S.active)return;S.active=null;restEnd=0;if(wl){try{wl.release()}catch(e){}wl=null}save();render();go('dash');toast('Séance arrêtée sans enregistrement')};
window.ironFinish=function(){if(!S.active)return;const a=S.active;const exos=a.exos.map(e=>({key:e.key,name:e.name,mode:e.mode,min:e.min,max:e.max,inc:e.inc,sets:e.sets.filter(x=>x.done||num(x.w)>0||num(x.r)>0).map(x=>({w:num(x.w),r:num(x.r)}))})).filter(e=>e.sets.length);S.sessions.push({id:uid(),date:todayISO(),progId:a.progId,name:a.name,dur:a.dur,minutes:Math.max(1,Math.round((Date.now()-a.start)/60000)),warm:a.warm&&a.warm.done?{min:a.warm.min,incline:a.warm.incline,speed:a.warm.speed}:null,exos});S.active=null;restEnd=0;if(wl){try{wl.release()}catch(e){}wl=null}if(exos.length)S.ui.exKey=exos[0].key;save();render();go('dash');toast('Séance enregistrée 💪')};
function act(a,d){
 switch(a){
  case 'closeSheet':closeSheet();break;
  case 'sheetSave':if(sheetCb){const r=sheetCb();if(r!==false){closeSheet();save();render()}}break;
  case 'gotoSess':go('sess');break;
  case 'gotoW':go('weight');break;
  case 'pie':S.ui.pie=d.m;save();render();break;
  case 'calPrev':shiftMonth(-1);break;case 'calNext':shiftMonth(1);break;
  case 'wu':{const w=S.active.warm,dl=parseFloat(d.d);
   if(d.k==='incline')w.incline=Math.min(16,Math.max(1,Math.round(w.incline+dl)));
   else if(d.k==='speed')w.speed=Math.min(20,Math.max(0.5,Math.round((w.speed+dl)*2)/2));
   else if(!w.tEnd)w.min=Math.min(60,Math.max(1,Math.round(w.min+dl)));
   save();render();break}
  case 'wuStart':{const w=S.active.warm;w.tEnd=Date.now()+w.min*60000;w.done=false;save();render();break}
  case 'wuStop':S.active.warm.tEnd=0;save();render();break;
  case 'wuDone':{const w=S.active.warm;w.done=!w.done;w.tEnd=0;save();render();break}
  case 'wAdd':if(addWeight($('#wKg').value,$('#wDate').value)){toast('Poids enregistré');render()}break;
  case 'wAddDash':if(addWeight($('#wDashIn').value,todayISO())){toast('Poids enregistré');render()}break;
  case 'wDel':if(confirm('Supprimer cette pesée ?')){S.weights=S.weights.filter(x=>x.id!==d.id);save();render()}break;
  case 'wRange':S.ui.wRange=d.m;save();render();break;
  case 'wGoal':{const v=num($('#wGoal').value);S.goalW=v>=20&&v<=400?Math.round(v*10)/10:null;save();render();toast(S.goalW?'Objectif enregistré':'Objectif retiré');break}
  case 'prepProg':S.ui.progId=d.id;go('sess');break;
  case 'selProg':S.ui.progId=d.id;save();render();break;
  case 'selDur':S.ui.dur=+d.m;save();render();break;
  case 'start':{
   const p=selProg();
   const dur=S.ui.dur,rest=p?(p.rest||75):75;
   const plan=p?buildPlan(p,dur).items:[];
   const lw=lastWarm(S.sessions);
   S.active={id:uid(),progId:p?p.id:'free',name:p?up(p.name):'SÉANCE LIBRE',dur:p?dur:0,start:Date.now(),rest,warm:{min:10,incline:lw.incline,speed:lw.speed,done:false,tEnd:0},exos:plan.map(i=>newExo(i,i.planned,rest))};
   save();wake();render();window.scrollTo(0,0);
   if(!p)openPicker();
   break}
  case 'exRest':{const e=S.active.exos[+d.i];openSheet(`<h3>Repos pour ${esc(e.name)}</h3><div class="chips">${[30,45,60,75,90,120,180].map(v=>`<button class="chip ${e.rest===v?'on':''}" data-act="setExRest" data-i="${d.i}" data-v="${v}">${v} s</button>`).join('')}</div>`);break}
  case 'setExRest':S.active.exos[+d.i].rest=+d.v;closeSheet();save();render();toast('Repos réglé à '+d.v+' s');break;
  case 'chk':{
   const e=S.active.exos[+d.i],s=e.sets[+d.j];s.done=!s.done;
   if(s.done){
    if(num(s.r)<=0){s.done=false;toast(e.mode==='reps'?'Saisis le nombre de reps':e.mode==='time'?'Saisis la durée':'Saisis les minutes');break}
    const more=e.sets.some(x=>!x.done)||S.active.exos.some((x,k)=>k>+d.i&&x.sets.some(y=>!y.done));
    if(e.mode!=='cardio'&&more)startRest(e.rest||75);
   }
   save();render();break}
  case 'addSet':{const e=S.active.exos[+d.i],l=e.sets[e.sets.length-1]||{w:'',r:e.min};e.sets.push({w:l.w,r:l.r,done:false});save();render();break}
  case 'delSet':{const e=S.active.exos[+d.i];if(e.sets.length>1)e.sets.pop();save();render();break}
  case 'rmEx':if(confirm('Retirer cet exercice de la séance ?')){S.active.exos.splice(+d.i,1);save();render()}break;
  case 'addEx':openPicker();break;
  case 'pick':{const m=pickList[+d.i];S.active.exos.push(newExo(m,m.mode==='cardio'?1:m.sets,S.active.rest));closeSheet();save();render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);break}
  case 'pickNew':exForm('Nouvel exercice',null,progSelectHTML(),o=>{
   S.active.exos.push(newExo(o,o.mode==='cardio'?1:o.sets,S.active.rest));
   const pid=$('#fP').value;if(pid&&P(pid))P(pid).ex.push(Object.assign({id:uid()},o));
  });break;
  case 'finish':finish();break;
  case 'abandon':if(confirm('Abandonner la séance en cours ? Rien ne sera enregistré.')){S.active=null;restEnd=0;save();render()}break;
  case 'restP':restEnd+=30000;restDone=false;tickRest();break;
  case 'restRestart':startRest(restTot||75);break;
  case 'restSkip':restEnd=0;$('#rest').className='';break;
  case 'editProg':progForm(P(d.id));break;
  case 'newProg':progForm(null);break;
  case 'delProg':if(confirm('Supprimer ce programme ? (l\'historique est conservé)')){S.programs=S.programs.filter(p=>p.id!==d.id);if(S.ui.progId===d.id)S.ui.progId=null;closeSheet();save();render()}break;
  case 'exAdd':exForm('Nouvel exercice',null,'',o=>{P(d.p).ex.push(Object.assign({id:uid()},o))});break;
  case 'exEdit':{const p=P(d.p),e=p.ex[+d.i];exForm('Modifier l\'exercice',e,'',o=>{Object.assign(e,o)});break}
  case 'exDel':if(confirm('Supprimer cet exercice du programme ?')){P(d.p).ex.splice(+d.i,1);save();render()}break;
  case 'exUp':{const l=P(d.p).ex,i=+d.i;if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];save();render()}break}
  case 'exDn':{const l=P(d.p).ex,i=+d.i;if(i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];save();render()}break}
  case 'duplicateSess':{const old=S.sessions.find(x=>x.id===d.id);if(!old)break;const lw=lastWarm(S.sessions);S.active={id:uid(),progId:old.progId,name:old.name,dur:old.dur||0,start:Date.now(),rest:75,warm:{min:old.warm?old.warm.min:10,incline:old.warm?old.warm.incline:lw.incline,speed:old.warm?old.warm.speed:lw.speed,done:false,tEnd:0},exos:old.exos.map(e=>({key:e.key,name:e.name,mode:e.mode,min:e.min,max:e.max,inc:e.inc,label:e.label||'',rest:e.rest||75,sets:e.sets.map(()=>({w:'',r:'',done:false}))}))};save();go('sess');toast('Séance dupliquée');break}
  case 'trashSess':{const i=S.sessions.findIndex(x=>x.id===d.id);if(i>=0){S.trash=S.trash||[];S.trash.push(S.sessions[i]);S.sessions.splice(i,1);save();render();toast('Séance déplacée dans la corbeille')}}break;
  case 'restoreSess':{const i=(S.trash||[]).findIndex(x=>x.id===d.id);if(i>=0){S.sessions.push(S.trash[i]);S.trash.splice(i,1);save();render();toast('Séance restaurée')}}break;
  case 'purgeSess':if(confirm('Supprimer définitivement cette séance ? Cette action est irréversible.')){S.trash=(S.trash||[]).filter(x=>x.id!==d.id);save();render();toast('Séance supprimée définitivement')}break;
  case 'exportF':download('ironlog-sauvegarde-'+todayISO()+'.json',JSON.stringify(S));toast('Sauvegarde exportée');break;
  case 'exportC':{const t=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Sauvegarde copiée'),()=>showBackup(t));else showBackup(t);break}
  case 'importO':openSheet(`<h3>Importer une sauvegarde</h3><input type="file" id="impF" accept=".json,application/json"><p class="mu sm" style="margin:10px 0 4px">ou colle le contenu ici :</p><textarea id="impT"></textarea><button class="btn" style="margin-top:10px" data-act="importGo">Importer</button><p class="mu sm">Attention : remplace toutes les données actuelles.</p>`);break;
  case 'importGo':{
   const f=$('#impF').files[0];
   const apply=t=>{try{const o=JSON.parse(t);if(!o.programs||!o.sessions)throw 0;S=o;S.ui=Object.assign({tab:'hist',progId:null,dur:60,exKey:null},S.ui||{});save();closeSheet();render();toast('Sauvegarde importée')}catch(e){toast('Fichier invalide')}};
   if(f){const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)}else apply($('#impT').value);
   break}
  case 'reset':window.ironAskReset();break;
 }
}
function showBackup(t){openSheet(`<h3>Sauvegarde</h3><p class="mu sm">Copie ce texte et garde-le (notes, mail…).</p><textarea id="bk" readonly>${esc(t)}</textarea>`);setTimeout(()=>{const x=$('#bk');if(x){x.select()}},50)}

// Gestion universelle des boutons, compatible Safari/iOS et ouverture depuis Fichiers.
let lastButton=null,lastButtonAt=0;
function buttonTarget(ev,selector){
 const path=ev.composedPath?ev.composedPath():[];
 for(const n of path)if(n&&n.matches&&n.matches(selector))return n;
 return ev.target&&ev.target.closest?ev.target.closest(selector):null;
}
function dispatchButton(ev){
 const tb=buttonTarget(ev,'#tabs button');
 const t=buttonTarget(ev,'[data-act]');
 const b=tb||t;if(!b)return;
 const now=Date.now();
 if(ev.type==='click'&&b===lastButton&&now-lastButtonAt<700)return;
 lastButton=b;lastButtonAt=now;
 if(ev.cancelable)ev.preventDefault();
 ev.stopPropagation();
 try{
  if(tb)go(tb.dataset.tab);
  else act(t.dataset.act,t.dataset);
 }catch(err){console.error(err);toast('Action impossible : '+(err&&err.message?err.message:'erreur'))}
}
document.addEventListener('pointerup',dispatchButton,true);
document.addEventListener('click',dispatchButton,true);
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.dataset&&t.dataset.in&&S.active){const s=S.active.exos[+t.dataset.i].sets[+t.dataset.j];s[t.dataset.in]=t.value;save();const r=$('#remain');if(r)r.textContent=remainMin(S.active);return}
 if(t.id==='durC'){const v=Math.round(num(t.value));if(v>=10&&v<=300){S.ui.dur=v;save();$('#planBox').innerHTML=planHTML();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));const m=document.querySelector('.chip[data-m="'+v+'"]');if(m)m.classList.add('on')}return}
 if(t.id==='pickQ'){$('#pickL').innerHTML=pickHTML(t.value);return}
});
document.addEventListener('change',ev=>{
 if(ev.target.id==='themeToggle'){setTheme(ev.target.checked?'dark':'light');return}
 if(ev.target.id==='exSel'){S.ui.exKey=ev.target.value;save();drawDash()}
 if(ev.target.id==='homeExSel'){S.ui.homeExKey=ev.target.value;save();drawExerciseCompare()}
});
render();wake();
})();
</script>
